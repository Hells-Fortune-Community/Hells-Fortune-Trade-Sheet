<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infernal Trade Worksheet</title>
  <style>
:root {
  --page-bg-top: #140408;
  --page-bg-bottom: #080203;

  --board-red-1: #660a12;
  --board-red-2: #3d050b;
  --board-red-3: #250308;

  --panel-bg: rgba(16, 4, 7, 0.76);
  --panel-inner: rgba(9, 3, 5, 0.86);

  --gold-1: #f4dfb2;
  --gold-2: #d8a24d;
  --gold-3: #8d541f;
  --gold-line: rgba(221, 166, 81, 0.72);
  --gold-line-soft: rgba(221, 166, 81, 0.28);

  --text-main: #f8ecd0;
  --text-soft: #d6c19e;
  --text-dim: #a78967;

  --radius-xl: 34px;
  --radius-lg: 24px;
  --radius-md: 18px;
  --radius-sm: 12px;

  --shadow-deep: rgba(0, 0, 0, 0.44);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text-main);
  background:
    radial-gradient(circle at 12% 12%, rgba(255, 81, 81, 0.11), transparent 24%),
    radial-gradient(circle at 88% 8%, rgba(239, 195, 105, 0.08), transparent 18%),
    linear-gradient(180deg, var(--page-bg-top) 0%, var(--page-bg-bottom) 100%);
}

body {
  display: grid;
  place-items: center;
  padding: 24px;
}

.page {
  width: 100%;
  display: grid;
  place-items: center;
}

.trade-board {
  position: relative;
  width: min(100%, 1600px);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 40px;
  border: 3px solid rgba(221, 166, 81, 0.52);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0) 14%),
    linear-gradient(180deg, var(--board-red-1) 0%, var(--board-red-2) 42%, var(--board-red-3) 100%);
  box-shadow:
    0 28px 80px var(--shadow-deep),
    inset 0 1px 0 rgba(255,255,255,0.05),
    inset 0 0 0 2px rgba(255, 221, 168, 0.05);
}

.trade-board::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(125deg, transparent 0 8%, rgba(255,255,255,0.03) 8% 8.2%, transparent 8.2% 100%),
    radial-gradient(circle at 50% 110%, rgba(255, 116, 88, 0.12), transparent 30%);
  pointer-events: none;
}

.board-shell {
  position: absolute;
  inset: 36px 52px;
  display: grid;
  grid-template-rows: 96px 1fr 136px;
  gap: 22px;
  padding: 0;
}

.board-ornament {
  position: absolute;
  width: 84px;
  height: 84px;
  opacity: 0.32;
  pointer-events: none;
}

.board-ornament::before,
.board-ornament::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 999px;
  border: 3px solid rgba(224, 173, 95, 0.44);
}

.board-ornament::before {
  clip-path: inset(0 42% 42% 0);
}

.board-ornament::after {
  clip-path: inset(42% 0 0 42%);
}

.top-left { top: 16px; left: 16px; }
.top-right { top: 16px; right: 16px; transform: scaleX(-1); }
.bottom-left { bottom: 16px; left: 16px; transform: scaleY(-1); }
.bottom-right { bottom: 16px; right: 16px; transform: scale(-1, -1); }

.header-box,
.panel {
  border-radius: 24px;
  border: 1px solid var(--gold-line);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0) 18%),
    linear-gradient(180deg, rgba(22, 6, 10, 0.95) 0%, rgba(10, 3, 5, 0.98) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.04),
    0 10px 24px rgba(0,0,0,0.16);
}

.board-header {
  display: grid;
  grid-template-columns: 336px 1fr 240px;
  gap: 22px;
}

.header-meta {
  padding: 16px 22px;
  display: grid;
  align-content: center;
  gap: 14px;
}

.meta-group {
  display: grid;
  gap: 3px;
}

.meta-label {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-dim);
}

.meta-value {
  min-height: 28px;
  font-size: 23px;
  font-weight: 900;
  line-height: 1.05;
  color: var(--text-main);
  outline: none;
}

.meta-value.small {
  font-size: 18px;
  color: var(--text-soft);
}

.header-title-box {
  display: grid;
  place-items: center;
  padding: 10px 20px;
  text-align: center;
}

.title-main {
  margin: 0;
  font-family: "Arial Black", "Trebuchet MS", system-ui, sans-serif;
  font-size: 34px;
  line-height: 0.98;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: transparent;
  background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 65%, var(--gold-3) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-stroke: 1.25px rgba(82, 31, 8, 0.82);
  text-shadow: 0 4px 14px rgba(255, 176, 82, 0.08);
}

.header-status {
  display: grid;
  place-items: center;
  padding: 14px;
}

.status-badge {
  min-width: 150px;
  min-height: 54px;
  padding: 12px 24px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(241, 201, 119, 0.34);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0) 34%),
    linear-gradient(180deg, #b62b39 0%, #72101d 100%);
  color: #fff5d7;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  outline: none;
}

.board-main {
  display: grid;
  grid-template-columns: 1.08fr 0.92fr;
  gap: 24px;
  min-height: 0;
}

.trade-panel,
.wants-panel,
.notes-panel {
  padding: 18px 18px 16px;
  min-width: 0;
  min-height: 0;
}

.trade-panel,
.wants-panel {
  display: grid;
  grid-template-rows: 48px 1fr;
  gap: 18px;
}

.section-title {
  display: grid;
  place-items: center;
  border-radius: 16px;
  border: 1px solid rgba(241, 199, 108, 0.26);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0) 40%),
    linear-gradient(180deg, #a71e2b 0%, #690f19 54%, #470912 100%);
  font-family: "Arial Black", "Trebuchet MS", system-ui, sans-serif;
  font-size: 18px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: transparent;
  background-clip: padding-box;
  position: relative;
  overflow: hidden;
}

.section-title::before {
  content: attr(data-text);
}

.section-title,
.section-title::before {
  text-shadow: none;
}

.section-title {
  color: transparent;
}

.section-title::after {
  content: attr(data-title);
}

.section-title {
  background:
    linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0) 40%),
    linear-gradient(180deg, #a71e2b 0%, #690f19 54%, #470912 100%);
}

.section-title {
  -webkit-text-stroke: 0;
}

.section-title {
  position: relative;
}

.section-title::before,
.section-title::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 48px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 223, 163, 0.56), transparent);
  transform: translateY(-50%);
}

.section-title::before { left: 16px; }
.section-title::after { right: 16px; }

.section-title {
  color: var(--gold-1);
  text-shadow:
    0 1px 0 rgba(76, 29, 8, 0.86),
    0 0 10px rgba(255, 173, 81, 0.06);
}

.trade-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(0, 1fr));
  gap: 16px 18px;
  min-height: 0;
}

.trade-slot {
  display: grid;
  grid-template-rows: minmax(0, 1fr) 26px;
  gap: 10px;
  min-height: 0;
}

.trade-art {
  position: relative;
  min-height: 0;
  border-radius: 16px;
  border: 1px solid rgba(220, 167, 82, 0.34);
  background:
    radial-gradient(circle at 50% 26%, rgba(236, 197, 111, 0.07), transparent 28%),
    linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0) 20%),
    linear-gradient(180deg, #11141a 0%, #0b0305 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}

.trade-art::before {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 12px;
  border: 1.5px dashed rgba(243, 208, 136, 0.15);
}

.entry-line,
.line-fill {
  min-height: 24px;
  outline: none;
}

.entry-line {
  border-bottom: 2px solid rgba(224, 173, 95, 0.58);
}

.lines-sheet {
  display: grid;
  align-content: start;
  gap: 18px;
  padding: 8px 4px 0;
  min-height: 0;
}

.wants-lines {
  padding-top: 10px;
}

.worksheet-line {
  display: grid;
  grid-template-columns: 28px 1fr;
  align-items: end;
  gap: 10px;
}

.note-line {
  grid-template-columns: 1fr;
}

.line-index {
  font-size: 15px;
  font-weight: 800;
  line-height: 1;
  color: var(--text-dim);
  text-align: right;
}

.line-fill {
  border-bottom: 2px solid rgba(224, 173, 95, 0.58);
  padding: 0 0 8px;
  font-size: 18px;
  line-height: 1.15;
  color: var(--text-main);
}

.board-footer {
  display: grid;
  grid-template-rows: 48px 1fr;
  gap: 16px;
}

.notes-lines {
  gap: 16px;
  padding-top: 8px;
}

[contenteditable="true"]:empty::before {
  content: "";
}

[contenteditable="true"]:focus {
  box-shadow: none;
}

@media (max-width: 1200px) {
  body {
    padding: 16px;
  }

  .trade-board {
    width: 100%;
  }

  .board-shell {
    inset: 24px 26px;
    grid-template-rows: auto auto auto;
  }

  .board-header {
    grid-template-columns: 1fr;
  }

  .board-main {
    grid-template-columns: 1fr;
  }

  .board-footer {
    min-height: 180px;
  }
}

</style>
</head>
<body>
  <div class="page">
    <section class="trade-board" aria-label="Infernal Trade Worksheet">
      <div class="board-ornament top-left"></div>
      <div class="board-ornament top-right"></div>
      <div class="board-ornament bottom-left"></div>
      <div class="board-ornament bottom-right"></div>

      <div class="board-shell">
        <header class="board-header">
          <div class="header-box header-meta">
            <div class="meta-group">
              <div class="meta-label">Trader</div>
              <div class="meta-value" contenteditable="true">Ella</div>
            </div>
            <div class="meta-group">
              <div class="meta-label">User / Contact</div>
              <div class="meta-value small" contenteditable="true">@youruser</div>
            </div>
          </div>

          <div class="header-box header-title-box">
            <h1 class="title-main">Infernal Trade Worksheet</h1>
          </div>

          <div class="header-box header-status">
            <div class="status-badge" contenteditable="true">Open</div>
          </div>
        </header>

        <main class="board-main">
          <section class="panel trade-panel">
            <div class="section-title">For Trade</div>
            <div class="trade-grid">
              <article class="trade-slot">
                <div class="trade-art"></div>
                <div class="entry-line" contenteditable="true"></div>
              </article>
              <article class="trade-slot">
                <div class="trade-art"></div>
                <div class="entry-line" contenteditable="true"></div>
              </article>
              <article class="trade-slot">
                <div class="trade-art"></div>
                <div class="entry-line" contenteditable="true"></div>
              </article>
              <article class="trade-slot">
                <div class="trade-art"></div>
                <div class="entry-line" contenteditable="true"></div>
              </article>
              <article class="trade-slot">
                <div class="trade-art"></div>
                <div class="entry-line" contenteditable="true"></div>
              </article>
              <article class="trade-slot">
                <div class="trade-art"></div>
                <div class="entry-line" contenteditable="true"></div>
              </article>
              <article class="trade-slot">
                <div class="trade-art"></div>
                <div class="entry-line" contenteditable="true"></div>
              </article>
              <article class="trade-slot">
                <div class="trade-art"></div>
                <div class="entry-line" contenteditable="true"></div>
              </article>
            </div>
          </section>

          <section class="panel wants-panel">
            <div class="section-title">Looking For</div>
            <div class="lines-sheet wants-lines">
              <div class="worksheet-line"><span class="line-index">1.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">2.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">3.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">4.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">5.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">6.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">7.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">8.</span><div class="line-fill" contenteditable="true"></div></div>
            </div>
          </section>
        </main>

        <footer class="board-footer panel notes-panel">
          <div class="section-title">Notes</div>
          <div class="lines-sheet notes-lines">
            <div class="worksheet-line note-line"><div class="line-fill" contenteditable="true">LF upgrades only. Taking offers on dupes.</div></div>
            <div class="worksheet-line note-line"><div class="line-fill" contenteditable="true"></div></div>
            <div class="worksheet-line note-line"><div class="line-fill" contenteditable="true"></div></div>
          </div>
        </footer>
      </div>
    </section>
  </div>
</body>
</html>
