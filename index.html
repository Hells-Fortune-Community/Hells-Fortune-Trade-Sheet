<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hell's Fortune Trade Sheet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <section class="trade-board" aria-label="Hell's Fortune Trade Sheet">
      <div class="board-ornament top-left"></div>
      <div class="board-ornament top-right"></div>
      <div class="board-ornament bottom-left"></div>
      <div class="board-ornament bottom-right"></div>

      <div class="board-shell">
        <header class="board-header">
          <div class="header-box header-user">
            <div class="meta-label">Username</div>
            <div class="meta-value" contenteditable="true">@youruser</div>
          </div>

          <div class="header-box header-title-box">
            <h1 class="title-main">Hell's Fortune Trade Sheet</h1>
          </div>
        </header>

        <main class="board-main">
          <section class="panel sheet-panel">
            <div class="section-title">For Trade</div>
            <div class="lines-sheet trade-lines">
              <div class="worksheet-line"><span class="line-index">1.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">2.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">3.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">4.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">5.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">6.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">7.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">8.</span><div class="line-fill" contenteditable="true"></div></div>
            </div>
          </section>

          <section class="panel sheet-panel">
            <div class="section-title">Looking For</div>
            <div class="lines-sheet wants-lines">
              <div class="worksheet-line"><span class="line-index">1.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">2.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">3.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">4.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">5.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">6.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">7.</span><div class="line-fill" contenteditable="true"></div></div>
              <div class="worksheet-line"><span class="line-index">8.</span><div class="line-fill" contenteditable="true"></div></div>
            </div>
          </section>
        </main>

        <footer class="board-footer panel notes-panel">
          <div class="section-title">Notes</div>
          <div class="lines-sheet notes-lines">
            <div class="worksheet-line note-line"><div class="line-fill" contenteditable="true">LF upgrades only. Taking offers on dupes.</div></div>
            <div class="worksheet-line note-line"><div class="line-fill" contenteditable="true"></div></div>
            <div class="worksheet-line note-line"><div class="line-fill" contenteditable="true"></div></div>
            <div class="worksheet-line note-line"><div class="line-fill" contenteditable="true"></div></div>
            <div class="worksheet-line note-line"><div class="line-fill" contenteditable="true"></div></div>
            <div class="worksheet-line note-line"><div class="line-fill" contenteditable="true"></div></div>
          </div>
        </footer>
      </div>
    </section>
  </div>
</body>
</html>
